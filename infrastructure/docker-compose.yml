version: '3.9'
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: credit_risk_api
    ports: ["8000:8000"]
    environment:
      - FRONTEND_URL=*
    restart: unless-stopped
    volumes:
      - ../backend/ml/saved_models:/app/ml/saved_models

  nginx:
    image: nginx:alpine
    container_name: credit_risk_nginx
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on: [api]
    restart: unless-stopped
